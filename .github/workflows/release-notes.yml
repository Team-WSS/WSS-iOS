name: Update Release Notes

# release 브랜치에 새 커밋이 반영될 때마다 실행됩니다.
# 버전은 사람이 직접 입력하지 않고, Xcode 프로젝트의 MARKETING_VERSION 값을
# 그대로 읽어와 사용합니다. (즉, 버전은 평소처럼 프로젝트에서 직접 올리면 됩니다.)
on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from Xcode project
        id: version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' WSSiOS.xcodeproj/project.pbxproj | sed -E 's/.*MARKETING_VERSION = ([0-9.]+);.*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::project.pbxproj에서 MARKETING_VERSION을 찾을 수 없습니다."
            exit 1
          fi
          echo "버전: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v.$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from merged PRs
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ steps.version.outputs.tag }}" \
            -f target_commitish="release")
          echo "$RESPONSE" | jq -r .body > /tmp/release-notes.md
          echo "name=$(echo "$RESPONSE" | jq -r .name)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="${{ steps.notes.outputs.name }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "기존 릴리즈($TAG)의 노트를 업데이트합니다."
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release-notes.md
          else
            echo "새 릴리즈($TAG)를 생성합니다."
            gh release create "$TAG" --target release --title "$TITLE" --notes-file /tmp/release-notes.md
          fi
